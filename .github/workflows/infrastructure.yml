name: provision-foundation
run-name: 'infrastructure ${{ inputs.orchestration_id }}'
on:
  workflow_dispatch:
    inputs:
      orchestration_id:
        description: Optional lifecycle controller correlation ID
        type: string
        required: false
      validation_only:
        description: Run credential-free helper tests without publishing or applying
        type: boolean
        default: true
      component:
        description: Dedicated foundation component to plan and provision
        required: true
        type: choice
        options: [bootstrap, registry]
permissions:
  contents: read
# One foundation operation at a time; never cancel an active apply.
concurrency:
  group: ${{ inputs.validation_only && format('azure-validation-{0}', github.run_id) || 'azure-resource-mutation' }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  ODYN_INFRA_COMPONENT: ${{ inputs.component }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_RESOURCE_GROUP: ${{ inputs.component == 'bootstrap' && vars.BOOTSTRAP_RESOURCE_GROUP || vars.REGISTRY_RESOURCE_GROUP }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  ARM_USE_OIDC: 'true'
  ARM_USE_AZUREAD: 'true'
  TF_IN_AUTOMATION: 'true'
jobs:
  validate:
    uses: ./.github/workflows/validate-delivery.yml
  plan:
    needs: validate
    if: ${{ !inputs.validation_only && github.ref == 'refs/heads/main' && vars.AZURE_FOUNDATION_ENABLED == 'true' }}
    environment: azure-foundation-plan
    runs-on: [self-hosted, linux, x64, odyn-azure]
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      APPLICATION_TFVARS_JSON: ${{ inputs.component == 'bootstrap' && secrets.BOOTSTRAP_TFVARS_JSON || secrets.REGISTRY_TFVARS_JSON }}
      TF_BACKEND_JSON: ${{ inputs.component == 'bootstrap' && secrets.BOOTSTRAP_BACKEND_JSON || secrets.REGISTRY_BACKEND_JSON }}
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r app/requirements.lock
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Require passing CI for the exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion,event,headSha,status > "$RUNNER_TEMP/foundation-ci-$GITHUB_RUN_ID.json"
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / f"foundation-ci-{os.environ['GITHUB_RUN_ID']}.json"
          runs = json.loads(path.read_text())
          assert any(r['headSha'] == os.environ['GITHUB_SHA'] and r['event'] == 'push' and r['status'] == 'completed' and r['conclusion'] == 'success' for r in runs), 'Exact-source push CI must pass first'
          PYCODE
      - name: Plan the selected foundation component and encrypt the plan
        run: |
          umask 077
          export ODYN_DELIVERY_DIR="$RUNNER_TEMP/odyn-foundation-$GITHUB_RUN_ID"
          python scripts/delivery.py prepare-infrastructure --directory "$ODYN_DELIVERY_DIR"
          terraform -chdir="$ODYN_DELIVERY_DIR/root" init -input=false -lockfile=readonly -backend-config="$ODYN_DELIVERY_DIR/backend.json" > "$ODYN_DELIVERY_DIR/init.log" 2>&1
          python scripts/delivery.py adopt-bootstrap-group --directory "$ODYN_DELIVERY_DIR"
          terraform -chdir="$ODYN_DELIVERY_DIR/root" plan -input=false -lock-timeout=60s -var-file="$ODYN_DELIVERY_DIR/application.tfvars.json" -out="$ODYN_DELIVERY_DIR/application.tfplan" > "$ODYN_DELIVERY_DIR/plan.log" 2>&1
          python scripts/delivery.py seal --directory "$ODYN_DELIVERY_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-foundation-plan
          path: ${{ runner.temp }}/odyn-foundation-${{ github.run_id }}/plan.enc
          retention-days: 1
          if-no-files-found: error
      - name: Remove private temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/odyn-foundation-$GITHUB_RUN_ID"
  apply:
    needs: plan
    environment: azure-foundation-apply
    runs-on: [self-hosted, linux, x64, odyn-azure]
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      APPLICATION_TFVARS_JSON: ${{ inputs.component == 'bootstrap' && secrets.BOOTSTRAP_TFVARS_JSON || secrets.REGISTRY_TFVARS_JSON }}
      TF_BACKEND_JSON: ${{ inputs.component == 'bootstrap' && secrets.BOOTSTRAP_BACKEND_JSON || secrets.REGISTRY_BACKEND_JSON }}
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r app/requirements.lock
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-foundation-plan
          path: ${{ runner.temp }}/odyn-foundation-${{ github.run_id }}/
      - name: Apply the original saved plan and require a clean second plan
        run: |
          umask 077
          export ODYN_DELIVERY_DIR="$RUNNER_TEMP/odyn-foundation-$GITHUB_RUN_ID"
          python scripts/delivery.py prepare-infrastructure --directory "$ODYN_DELIVERY_DIR"
          python scripts/delivery.py unseal --directory "$ODYN_DELIVERY_DIR"
          terraform -chdir="$ODYN_DELIVERY_DIR/root" init -input=false -lockfile=readonly -backend-config="$ODYN_DELIVERY_DIR/backend.json" > "$ODYN_DELIVERY_DIR/init.log" 2>&1
          terraform -chdir="$ODYN_DELIVERY_DIR/root" apply -input=false "$ODYN_DELIVERY_DIR/application.tfplan" > "$ODYN_DELIVERY_DIR/apply.log" 2>&1
          terraform -chdir="$ODYN_DELIVERY_DIR/root" plan -input=false -detailed-exitcode -lock-timeout=60s -var-file="$ODYN_DELIVERY_DIR/application.tfvars.json" > "$ODYN_DELIVERY_DIR/second-plan.log" 2>&1
          printf '### Foundation verification\nSaved plan applied; second plan returned no changes.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove private temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/odyn-foundation-$GITHUB_RUN_ID"
