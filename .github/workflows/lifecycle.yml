name: Recreate Azure environment
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected configuration profile; disposable never uses live settings
        type: choice
        options: [deployment, disposable]
        default: deployment
      validation_only:
        description: Validate orchestration without dispatching Azure workflows
        type: boolean
        default: true
      setup_minutes:
        description: Approved setup deadline, 10–150 minutes; execution lease must cover setup and retirement
        type: number
        default: 50
permissions:
  contents: read
concurrency:
  group: azure-lifecycle-controller
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate-delivery.yml
  recreate:
    needs: validate
    if: ${{ !inputs.validation_only && github.ref == 'refs/heads/main' && vars.AZURE_LIFECYCLE_ENABLED == 'true' }}
    environment: azure-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Recreate in dependency order and retire execution on completion
        env:
          GH_TOKEN: ${{ github.token }}
          LIFECYCLE_FLAGS_JSON: ${{ toJSON(vars) }}
          LIFECYCLE_TARGET: ${{ inputs.target }}
          SETUP_MINUTES: ${{ inputs.setup_minutes }}
        run: python scripts/lifecycle.py --execute --minutes "$SETUP_MINUTES"
