name: deploy-azure
run-name: 'deploy ${{ inputs.orchestration_id }}'
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected configuration profile; disposable never uses live settings
        type: choice
        options: [deployment, disposable]
        default: deployment
      orchestration_id:
        description: Optional lifecycle controller correlation ID
        type: string
        required: false
      validation_only:
        description: Run credential-free helper tests without publishing or applying
        type: boolean
        default: true
      rollback_deployment_run_id:
        description: Successful deployment run whose verified images should be restored
        required: false
        type: string
      release_run_id:
        description: Required for a real deployment; successful release-images run ID
        required: false
        type: string
  workflow_call:
    inputs:
      target:
        type: string
        default: deployment
      orchestration_id:
        type: string
        default: ''
      validation_only:
        type: boolean
        default: true
      release_run_id:
        type: string
        default: ''
      rollback_deployment_run_id:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ inputs.validation_only && format('azure-validation-{0}', github.run_id) || 'azure-resource-mutation' }}
  cancel-in-progress: false
# Private endpoints require a dedicated ephemeral runner inside the Azure network.
# Never attach this runner to pull-request jobs or enable it before environment setup.
defaults:
  run:
    shell: bash
jobs:
  validate:
    uses: ./.github/workflows/validate-delivery.yml
  plan:
    needs: validate
    if: ${{ !inputs.validation_only && github.ref == 'refs/heads/main' && vars.AZURE_DELIVERY_ENABLED == 'true' }}
    environment: ${{ inputs.target == 'disposable' && 'azure-test-plan' || 'azure-plan' }}
    runs-on: [self-hosted, linux, x64, odyn-azure]
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DELIVERY_TARGET: ${{ inputs.target }}
      ROLLBACK_DEPLOYMENT_RUN_ID: ${{ inputs.rollback_deployment_run_id }}
      GH_TOKEN: ${{ github.token }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      TF_IN_AUTOMATION: 'true'
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      APPLICATION_TFVARS_JSON: ${{ secrets.APPLICATION_TFVARS_JSON }}
      TF_BACKEND_JSON: ${{ secrets.TF_BACKEND_JSON }}
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r app/requirements.lock
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Require passing CI for this exact workflow source
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --json conclusion,event,headSha,status > "$RUNNER_TEMP/delivery-ci.json"
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          runs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'delivery-ci.json').read_text())
          assert any(r['headSha'] == os.environ['GITHUB_SHA'] and r['event'] == 'push' and r['status'] == 'completed' and r['conclusion'] == 'success' for r in runs), 'Exact-source push CI must pass'
          PYCODE
      - name: Verify release source and workflow
        if: ${{ inputs.rollback_deployment_run_id == '' }}
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          run_id = os.environ['RELEASE_RUN_ID']
          assert run_id.isdigit(), 'Release run ID must be numeric'
          r = json.loads(subprocess.check_output(['gh', 'api', f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"]))
          assert r['path'] == '.github/workflows/release.yml' and r['head_sha'] == os.environ['GITHUB_SHA'] and r['head_branch'] == 'main' and r['conclusion'] == 'success' and r['event'] == 'workflow_dispatch', 'Release must be successful and match this exact source'
          PY
      - uses: actions/download-artifact@v4
        if: ${{ inputs.rollback_deployment_run_id == '' }}
        with:
          name: verified-release
          path: .artifacts/release/
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
      - name: Download prior verified deployment for rollback
        if: ${{ inputs.rollback_deployment_run_id != '' }}
        run: |
          python - <<'PYCODE'
          import os, re, subprocess
          run_id = os.environ['ROLLBACK_DEPLOYMENT_RUN_ID']
          assert re.fullmatch(r'[1-9][0-9]*', run_id)
          subprocess.run(['gh', 'run', 'download', run_id, '--repo', os.environ['GITHUB_REPOSITORY'], '--name', 'verified-deployment', '--dir', '.artifacts/rollback'], check=True)
          PYCODE
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare verified image inputs
        id: prepared
        run: |
          umask 077
          export ODYN_DELIVERY_DIR="$RUNNER_TEMP/odyn-delivery-$GITHUB_RUN_ID"
          if [ -n "$ROLLBACK_DEPLOYMENT_RUN_ID" ]; then
            python scripts/delivery.py prepare --directory "$ODYN_DELIVERY_DIR" --release .artifacts/rollback/deployment.json
          else
            python scripts/delivery.py prepare --directory "$ODYN_DELIVERY_DIR" --release .artifacts/release/release.json
          fi
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['ODYN_DELIVERY_DIR']) / 'release.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('gateway', 'collector'):
                  output.write(f"{name}={release['images'][name]['reference']}\n")
          PYCODE
      - name: Authenticate remote rollback image scans
        if: ${{ inputs.rollback_deployment_run_id != '' }}
        run: |
          python - <<'PYCODE'
          import json, os, subprocess
          registry = os.environ['ACR_LOGIN_SERVER'].removesuffix('.azurecr.io')
          token = json.loads(subprocess.check_output(['az', 'acr', 'login', '--name', registry, '--expose-token', '-o', 'json']))['accessToken']
          assert isinstance(token, str) and token and '\n' not in token and '\r' not in token
          print(f'::add-mask::{token}')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('TRIVY_USERNAME=00000000-0000-0000-0000-000000000000\n')
              env.write(f'TRIVY_PASSWORD={token}\n')
          PYCODE
      - name: Rescan prior gateway image before rollback
        if: ${{ inputs.rollback_deployment_run_id != '' }}
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ steps.prepared.outputs.gateway }}
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Rescan prior collector image before rollback
        if: ${{ inputs.rollback_deployment_run_id != '' }}
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
        with:
          image-ref: ${{ steps.prepared.outputs.collector }}
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Create and encrypt the saved plan
        run: |
          umask 077
          export ODYN_DELIVERY_DIR="$RUNNER_TEMP/odyn-delivery-$GITHUB_RUN_ID"
          terraform -chdir=infra/envs/dev/azure init -input=false -lockfile=readonly -backend-config="$ODYN_DELIVERY_DIR/backend.json" > "$ODYN_DELIVERY_DIR/init.log" 2>&1
          python scripts/delivery.py adopt-bootstrap-group --directory "$ODYN_DELIVERY_DIR"
          terraform -chdir=infra/envs/dev/azure plan -input=false -lock-timeout=60s -var-file="$ODYN_DELIVERY_DIR/application.tfvars.json" -out="$ODYN_DELIVERY_DIR/application.tfplan" > "$ODYN_DELIVERY_DIR/plan.log" 2>&1
          python scripts/delivery.py seal --directory "$ODYN_DELIVERY_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-saved-plan
          path: ${{ runner.temp }}/odyn-delivery-${{ github.run_id }}/plan.enc
          retention-days: 1
          if-no-files-found: error
      - name: Encrypt bounded failure diagnostics
        if: failure()
        run: python scripts/delivery.py diagnostics --directory "$RUNNER_TEMP/odyn-delivery-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: encrypted-delivery-diagnostics-${{ github.job }}
          path: ${{ runner.temp }}/odyn-delivery-${{ github.run_id }}/diagnostics.enc
          retention-days: 1
          if-no-files-found: error
      - name: Remove private temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/odyn-delivery-$GITHUB_RUN_ID" infra/envs/dev/azure/.terraform .artifacts/release .artifacts/rollback
  apply:
    needs: plan
    environment: ${{ inputs.target == 'disposable' && 'azure-test-deploy' || 'azure-deploy' }}
    runs-on: [self-hosted, linux, x64, odyn-azure]
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DELIVERY_TARGET: ${{ inputs.target }}
      ROLLBACK_DEPLOYMENT_RUN_ID: ${{ inputs.rollback_deployment_run_id }}
      GH_TOKEN: ${{ github.token }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      TF_IN_AUTOMATION: 'true'
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      APPLICATION_TFVARS_JSON: ${{ secrets.APPLICATION_TFVARS_JSON }}
      TF_BACKEND_JSON: ${{ secrets.TF_BACKEND_JSON }}
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --require-hashes -r app/requirements.lock
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: encrypted-saved-plan
          path: ${{ runner.temp }}/odyn-delivery-${{ github.run_id }}/
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify and apply the exact saved plan
        run: |
          umask 077
          export ODYN_DELIVERY_DIR="$RUNNER_TEMP/odyn-delivery-$GITHUB_RUN_ID"
          python scripts/delivery.py unseal --directory "$ODYN_DELIVERY_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['ODYN_DELIVERY_DIR'])
          (p / 'backend.json').write_text(json.dumps(json.loads(os.environ['TF_BACKEND_JSON'])))
          PY
          terraform -chdir=infra/envs/dev/azure init -input=false -lockfile=readonly -backend-config="$ODYN_DELIVERY_DIR/backend.json" > "$ODYN_DELIVERY_DIR/init.log" 2>&1
          terraform -chdir=infra/envs/dev/azure apply -input=false "$ODYN_DELIVERY_DIR/application.tfplan" > "$ODYN_DELIVERY_DIR/apply.log" 2>&1
          terraform -chdir=infra/envs/dev/azure show -json "$ODYN_DELIVERY_DIR/application.tfplan" > "$ODYN_DELIVERY_DIR/applied-plan.json"
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          d = Path(os.environ['ODYN_DELIVERY_DIR'])
          plan = json.loads((d / 'applied-plan.json').read_text())
          (d / 'application.tfvars.json').write_text(json.dumps({k: v['value'] for k, v in plan['variables'].items()}))
          PYCODE
          terraform -chdir=infra/envs/dev/azure plan -input=false -detailed-exitcode -lock-timeout=60s -var-file="$ODYN_DELIVERY_DIR/application.tfvars.json" > "$ODYN_DELIVERY_DIR/second-plan.log" 2>&1
      - name: Resolve the endpoint from this deployment
        run: python scripts/cloud-smoke.py --resource-group "$AZURE_RESOURCE_GROUP" --export-endpoint "$GITHUB_ENV"
      - name: Verify revision readiness and public health
        run: |
          python - <<'PY'
          import json, os, subprocess, time, urllib.parse, urllib.request
          url = os.environ['HEALTH_URL']
          u = urllib.parse.urlsplit(url)
          assert u.scheme == 'https' and u.hostname and not u.username and not u.password and u.path == '/v1/healthz' and not u.query and not u.fragment
          for _ in range(30):
              apps = json.loads(subprocess.check_output(['az', 'containerapp', 'list', '-g', os.environ['AZURE_RESOURCE_GROUP'], '-o', 'json']))
              assert len(apps) == 1, 'Expected one gateway app'
              p = apps[0]['properties']
              if p.get('latestRevisionName') and p.get('latestRevisionName') == p.get('latestReadyRevisionName'):
                  with urllib.request.urlopen(url, timeout=10) as response:
                      assert response.status == 200
                  break
              time.sleep(10)
          else:
              raise SystemExit('Revision readiness timed out; inspect Azure before retrying')
          PY
      - name: Verify public routing, HSTS, rejected authentication and CORS
        env:
          CLIENT_ORIGIN: ${{ vars.ODYN_CLIENT_ORIGIN }}
        run: python scripts/cloud-smoke.py --chat-url "$CLOUD_CHAT_URL" --origin "${CLIENT_ORIGIN:-https://diwaker-singh.github.io}"
      - name: Record successfully verified deployment
        run: python scripts/delivery.py record-deployment --directory "$RUNNER_TEMP/odyn-delivery-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-deployment
          path: ${{ runner.temp }}/odyn-delivery-${{ github.run_id }}/deployment.json
          retention-days: 90
          if-no-files-found: error
      - name: Encrypt bounded failure diagnostics
        if: failure()
        run: python scripts/delivery.py diagnostics --directory "$RUNNER_TEMP/odyn-delivery-$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: encrypted-delivery-diagnostics-${{ github.job }}
          path: ${{ runner.temp }}/odyn-delivery-${{ github.run_id }}/diagnostics.enc
          retention-days: 1
          if-no-files-found: error
      - name: Remove private temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/odyn-delivery-$GITHUB_RUN_ID" infra/envs/dev/azure/.terraform
